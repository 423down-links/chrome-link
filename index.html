function copyText(id, btn) {
  var el = document.getElementById(id);
  if (!el || !el.dataset.sha) return;
  var text = el.dataset.sha;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() {
      if (btn) { btn.classList.add('copied'); setTimeout(function(){ btn.classList.remove('copied'); }, 1500); }
      showToast('SHA256 已复制');
    }).catch(function() { fallbackCopy(text, btn); });
  } else {
    fallbackCopy(text, btn);
  }
}

function fallbackCopy(text, btn) {
  var ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
  if (btn) { btn.classList.add('copied'); setTimeout(function(){ btn.classList.remove('copied'); }, 1500); }
  showToast('SHA256 已复制');
}

function showToast(msg) {

// UTC-4 显示（固定偏移，对应美东夏令时）
function fmtUTC4(isoStr) {
  var t = new Date(isoStr);
  if (isNaN(t.getTime())) return isoStr;
  var s = new Date(t.getTime() - 4 * 3600 * 1000).toISOString().slice(0, 16).replace('T', ' ');
  return s + ' (UTC-4)';
}

function renderData(data) {

    var tr = document.createElement('tr');

    } else {

      '<td class="ver">' + item.version + '</td>' +
      '<td class="size">' + item.size + '</td>' +
      '<td class="fname">' + item.fileName + '</td>' +
      '<td>' + shaCell + '</td>' +
      '<td><a class="dl-link" href="' + item.downloadURL + '" target="_blank" rel="noopener">下载 ↓</a></td>';
    body.appendChild(tr);
  });

    document.getElementById('versionInfo').textContent = '数据更新：' + fmtUTC4(data.checked_at) + ' · 共 ' + items.length + ' 个版本';

}

  var pending = APPIDS.length;

      '<app appid="' + t.appid + '" ap="' + t.ap + '" version="" lang="zh-CN" brand="GCEA" installage="1">' +
      '<updatecheck/></app></request>';
    fetch('https://update.googleapis.com/service/update2', {
      method: 'POST',
      headers: { 'Content-Type': 'application/xml' },
      body: xml
    }).then(function(r) { return r.text(); }).then(function(text) {
      var mVer = text.match(/<manifest version="([^"]+)"/);
      var mName = text.match(/<package[^>]*name="([^"]+)"/);
      var mSize = text.match(/<package[^>]*size="(\d+)"/);
      var mSha = text.match(/hash_sha256="([^"]+)"/);
      var mCb = text.match(/<url codebase="(https:\/\/[^"]+)"/);
      if (!mVer || !mName || !mCb) return;
      results[t.key] = {
        key: t.key, channel: t.channel, arch: t.arch,
        version: mVer[1],
        size: (parseInt(mSize && mSize[1], 10) / 1048576).toFixed(0) + 'MB',
        downloadURL: mCb[1] + mName[1],
        sha256: (mSha && mSha[1]) ? mSha[1].toLowerCase() : '',
        fileName: mName[1]
      };
    }).catch(function() {}).finally(function() {
      pending--;
      if (pending === 0) {
        var fresh = APPIDS.map(function(t) { return results[t.key]; }).filter(Boolean);

          EMBEDDED_DATA = { checked_at: new Date().toISOString(), items: keep.concat(fresh) };
          renderData(EMBEDDED_DATA);
        }
      }
    });
  });
}
