name: Update Chrome Version

on:
  schedule:
    # 每12小时检测官方 API：北京时间 05:00 / 17:00（UTC 21:00 / 09:00）；有更新自动 push + 部署
    - cron: '0 21,9 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Debug versionhistory
        run: |
          set -x
          curl -sS -i --max-time 25 "https://versionhistory.googleapis.com/v1/chrome/platforms/win64/channels/stable/releases?order_by=starttime%20desc&page_size=5" | head -c 3000
          echo
          curl -sS -i --max-time 25 "https://chromiumdash.appspot.com/fetch_releases?channel=Stable&platform=Windows&num=3" | head -c 1000

      - name: Run update script
        run: python3 scripts/update_embedded.py

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "423down"
          git config user.email "zd423@qq.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无版本更新，跳过推送"
          else
            git commit -m "chore: update Chrome version $(date +%F) [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        # 检测到更新（schedule/dispatch）或代码/数据变更（push）时都立即部署；直用 wrangler 避开组织对第三方 action 的限制
        if: github.event_name == 'push' || steps.commit.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1f5e2d11ee6dfb31343229a8e5c819b3
        run: npx --yes wrangler@3 pages deploy . --project-name chromelnk --branch main
